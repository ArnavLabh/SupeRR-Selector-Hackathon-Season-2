[project]
name = "pressure"
version = "1.0.0"
description = "Pressure performance ratings for T20 batters and bowlers (SupeRR Selector Season 2)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
report = ["matplotlib>=3.9", "jinja2>=3.1", "python-pptx>=1.0", "pymupdf>=1.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
